<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Profilo utente | MyMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700,900&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-vector/20220608/ourlarge/pngtree-music-note-icon-green-vector-isolated-on-white-background-png-image_4932553.png" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            color: #f1f3f4;
        }
        .profile-card {
            background: #181818;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(30,215,96,0.10);
            padding: 2.5rem 2rem;
            max-width: 540px;
            margin: 48px auto;
        }
        .profile-title {
            color: #1ed760;
            font-weight: 700;
        }
        .playlist-list {
            margin-top: 1.5rem;
        }
        .playlist-item {
            background: #232526;
            border-radius: 10px;
            padding: 1rem 1.2rem;
            margin-bottom: 1rem;
            box-shadow: 0 2px 8px rgba(30,215,96,0.04);
        }
        .playlist-item a {
            color: #1ed760;
            font-weight: 500;
            text-decoration: none;
        }
        .playlist-item a:hover {
            text-decoration: underline;
            color: #1db954;
        }
        .badge-spotify {
            background: #1ed760;
            color: #181818;
            font-weight: 600;
            font-size: 0.95em;
        }
        .profile-actions {
            margin-top: 1.5rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        .btn-edit {
            background: #1ed760;
            color: #181818;
            border: none;
        }
        .btn-edit:hover, .btn-edit:focus {
            background: #1db954;
            color: #181818;
        }
        .btn-delete {
            background: #ff4d4f;
            color: #fff;
            border: none;
        }
        .btn-delete:hover, .btn-delete:focus {
            background: #d90429;
            color: #fff;
        }
        .modal-content {
            background: #232526;
            color: #f1f3f4;
        }
        .modal-footer .btn {
            min-width: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div id="user-profile"></div>
            <div class="profile-actions">
                <button id="edit-profile" class="btn btn-edit rounded-pill px-4"><i class="fas fa-pen me-2"></i>Modifica</button>
                <button id="delete-profile" class="btn btn-delete rounded-pill px-4"><i class="fas fa-trash me-2"></i>Elimina</button>
            </div>
            <div class="text-center mt-4">
                <a href="index.html" class="btn btn-outline-light"><i class="fas fa-home me-2"></i>Torna alla Home</a>
            </div>
        </div>
    </div>

    <!-- Modal conferma eliminazione -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="deleteModalLabel">Elimina profilo</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Chiudi"></button>
          </div>
          <div class="modal-body">
            Sei sicuro di voler <span class="text-danger fw-bold">eliminare il tuo profilo</span>?<br>
            Questa azione è <b>irreversibile</b> e perderai tutte le tue playlist e quelle che hai condiviso.
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Annulla</button>
            <button type="button" class="btn btn-delete rounded-pill" id="confirm-delete">Elimina</button>
          </div>
        </div>
      </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const userID = params.get('user');
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const user = users.find(u => u.userID === userID);
        const container = document.getElementById('user-profile');

        function renderProfile(user) {
            let playlistsHtml = '';
            if (user.playlist && user.playlist.length > 0) {
                playlistsHtml = `
                    <div class="playlist-list">
                        <h5 class="mb-3" style="color:#1ed760;">Playlist pubblicate</h5>
                        ${user.playlist.map(pl => `
                            <div class="playlist-item">
                                <a href="playlist.html?name=${encodeURIComponent(pl.nome)}">${pl.nome}</a>
                                <span class="badge badge-spotify ms-2">${pl.tracks ? pl.tracks.length : 0} brani</span>
                                ${pl.descrizione ? `<div class="small mt-1 text-light">${pl.descrizione}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            } else {
                playlistsHtml = `<div class="alert alert-secondary mt-4">Nessuna playlist pubblicata.</div>`;
            }
            container.innerHTML = `
                <div class="text-center mb-4">
                    <i class="fas fa-user-circle fa-4x mb-3" style="color:#1ed760;"></i>
                    <h2 class="profile-title mb-1">${user.userID}</h2>
                    <div class="mb-2 text-muted">${user.email ? user.email : ''}</div>
                </div>
                <hr style="border-top:2px solid #1ed760;opacity:.5;">
                <div class="mb-3">
                    <strong>Nome:</strong> ${user.nome || ''}<br>
                    <strong>Cognome:</strong> ${user.cognome || ''}<br>
                    <strong>Genere:</strong> ${user.genere || ''}<br>
                    <strong>Artista preferito:</strong> ${user.cantantePreferito || '-'}<br>
                    <strong>Genere musicale preferito:</strong> ${user.generePreferito || '-'}
                </div>
                ${playlistsHtml}
            `;
        }

        if (user) {
            renderProfile(user);
        } else {
            container.innerHTML = `<div class="alert alert-danger">Utente non trovato.</div>`;
            document.querySelector('.profile-actions').style.display = 'none';
        }

        // Modifica profilo
        document.getElementById('edit-profile').addEventListener('click', function() {
            window.location.href = `edit-profile.html?user=${encodeURIComponent(userID)}`;
        });

        // Elimina profilo
        document.getElementById('delete-profile').addEventListener('click', function() {
            const modal = new bootstrap.Modal(document.getElementById('deleteModal'));
            modal.show();
        });

        document.getElementById('confirm-delete').addEventListener('click', function() {
            // Rimuovi utente da localStorage
            const updatedUsers = users.filter(u => u.userID !== userID);
            localStorage.setItem('users', JSON.stringify(updatedUsers));
            // Rimuovi playlist condivise dall'utente
            let shared = JSON.parse(localStorage.getItem('sharedPlaylists') || '[]');
            shared = shared.filter(pl => pl.owner !== userID);
            localStorage.setItem('sharedPlaylists', JSON.stringify(shared));
            // Logout se era loggato
            if (sessionStorage.getItem('logged') === userID) {
                sessionStorage.removeItem('logged');
            }
            window.location.href = "index.html";
        });
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
