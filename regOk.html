<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Registrazione Avvenuta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #fff;
            padding: 2rem 3rem;
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            text-align: center;
        }
        .container h2 {
            color: #2e7d32;
            margin-bottom: 1rem;
        }
        .container p {
            margin-bottom: 2rem;
            color: #333;
        }
        .btn {
            background: #1976d2;
            color: #fff;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Registrazione completata!</h2>
        <p>La tua registrazione è andata a buon fine.<br>
        Ora puoi accedere con le tue credenziali.</p>
        <a href="login.html"><button class="btn">Vai al Login</button></a>
    </div>
</body>
</html>
