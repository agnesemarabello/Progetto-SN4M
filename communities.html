<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Comunità Musicali | MyMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" href="https://png.pngtree.com/png-vector/20220608/ourlarge/pngtree-music-note-icon-green-vector-isolated-on-white-background-png-image_4932553.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="styles/com.css">

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <div class="logo">
                    <i class="fas fa-music"></i>
                    <span>MyMusic</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" href="communities.html">Comunità</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="shared-playlists.html">Esplora</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="share.html">Condividi</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5 mb-5">
        <h2 class="section-title">Comunità Musicali</h2>
        <div class="container mt-5 mb-5">
    <div id="community-section">
    <form id="search-community-form" class="mb-4">
        <input type="text" class="form-control text-white mb-3" id="community-search" placeholder="Cerca per titolo, descrizione o tag...">
    </form>

        
        <div id="community-list" class="mb-5"></div>
        <hr>
        <h4 class="section-title">Crea una nuova comunità</h4>
        <form id="create-community-form" class="mb-4">
            <label for="community-title" class="form-label fw-bold">Titolo</label>
            <input type="text" class="form-control text-white mb-3" id="community-title" placeholder="Titolo" required>
            <label for="community-desc" class="form-label fw-bold">Descrizione</label>
            <textarea class="form-control text-white mb-3" id="community-desc" placeholder="Inserisci una descrizione" rows="2" required></textarea>
            <label for="community-tags" class="form-label fw-bold">Tag separati da virgola</label>
            <input type="text" class="form-control text-white mb-3" id="community-tags" placeholder="Inserisci tag separati da virgola" required>
            <button class="btn btn-spotify px-4" type="submit"><i class="fas fa-plus me-2"></i>Crea comunità</button>
            <div id="community-create-msg" class="mt-3"></div>
        </form>
    </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/communities.js"></script>
</body>
</html>
