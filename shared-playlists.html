<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Playlist Condivise | MyMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" href="https://png.pngtree.com/png-vector/20220608/ourlarge/pngtree-music-note-icon-green-vector-isolated-on-white-background-png-image_4932553.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="styles/shared.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <div class="logo">
                    <i class="fas fa-music"></i>
                    <span>MyMusic</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link " href="communities.html">Comunità</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="shared-playlists.html">Esplora</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="share.html">Condividi</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="section-title mb-4"><i class="fas fa-users me-2"></i>Playlist condivise nelle tue comunità</h2>
        <form id="search-shared-form" class="mb-4">
            <div class="row g-2">
                <div class="col-md-5">
                    <label for="shared-tag" class="form-label fw-bold">Cerca per tag</label>
                    <input type="text" class="form-control text-white mb-3" id="shared-tag" placeholder="Cerca per tag...">
                </div>
                <div class="col-md-5">
                    <label for="shared-song" class="form-label fw-bold">Cerca per canzone</label>
                    <input type="text" class="form-control text-white mb-3" id="shared-song" placeholder="Cerca per canzone...">
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-spotify btn-lg" id = "btn-cerca" type="submit"><i class="fas fa-search me-1"></i>Cerca</button>
                </div>
            </div>
        </form>
        <div id="shared-playlist-list"></div>

    </div>
    <script src="js/sharedSearch.js"></script>
</body>
</html>
