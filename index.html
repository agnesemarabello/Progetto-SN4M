<!DOCTYPE html>
<html lang="it">
<head>
    <title>Home | MyMusic</title>
  
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700,900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" href="https://png.pngtree.com/png-vector/20220608/ourlarge/pngtree-music-note-icon-green-vector-isolated-on-white-background-png-image_4932553.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <div class="logo">
                    <i class="fas fa-music"></i>
                    <span>MyMusic</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="communities.html">Comunità</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="shared-playlists.html">Esplora</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="share.html">Condividi</a>
                    </li>
                </ul>
                <form class="d-flex me-2 position-relative" role="search" id="search-form" autocomplete="off">
                    <input class="form-control" type="search" placeholder="Cosa vuoi ascoltare?" aria-label="Search" id="searchInput" autocomplete="off">
                    <button class="btn btn-cerca ms-2" type="submit">
                        <i class="fas fa-search"></i>
                    </button>
                    <div id="search-preview" class="list-group position-absolute w-100" style="top:100%; z-index:10; display:none;"></div>
                </form>
                <button class="btn btn-iscriviti me-2" type="button" id="signup-btn">Iscriviti</button>
                <button class="btn btn-accedi" type="button" id="login-btn">Accedi</button>
                <button class="btn btn-accedi" type="button" id="logout-btn">Esci</button>

                    <script>
                        const logoutBtn = document.getElementById("logout-btn");
                        const clonedBtn = logoutBtn.cloneNode(true);
                        logoutBtn.parentNode.replaceChild(clonedBtn, logoutBtn);

                        clonedBtn.addEventListener("click", function (e) {
                        e.preventDefault(); // Impedisce ogni comportamento predefinito
                        e.stopImmediatePropagation(); // Blocca altri eventuali listener

                        Swal.fire({
                            title: 'Sei sicuro di voler uscire?',
                            icon: 'question',
                            showCancelButton: true,
                            confirmButtonText: 'Sì, esci',
                            cancelButtonText: 'Annulla',
                            confirmButtonColor: '#d33',
                            cancelButtonColor: '#232526',
                            background: '#181818',
                            color: '#fff'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                sessionStorage.removeItem("logged");
                                window.location.href = "index.html";
                                console.log("Logout effettuato con successo");
                            } else {
                                console.log("Logout annullato");
                            }
                        });
                    });
                    </script>

                <button class="btn btn-outline-light ms-2 d-none" type="button" id="profile-btn">
                    <i class="fas fa-user"></i> Profilo
                </button>
            </div>
        </div>
    </nav>

    <main class="container">
        <div id="auth-section">
            <p class="lead text-center" style="font-size: 1.5rem; margin-top: 2rem;">
                Benvenuto in <span class="fw-bold" style="color:#1ed760;">MyMusic</span>!<br>
                <span style="font-size: 1.1rem;"><a href="login.html" class="link-success">Accedi</a> o <a href="signup.html" class="link-success">Registrati</a> per iniziare.</span>
            </p>        
        </div>
        <div id="dashboard" style="display: none;">
            <h2 class="mb-4">
                <span id="welcome-text">Benvenuto</span>, <span id="username"></span>!
            </h2>
            <script>
                const users = localStorage.getItem('users');
                const currentUser = sessionStorage.getItem('logged');

                let user = null;
                if (users) {
                    try {
                        user = JSON.parse(users).find(user => user.userID === currentUser);
                    } catch (e) {
                        user = null;
                    }
                }

                if (user && user.genere === "F") {
                    document.getElementById('welcome-text').textContent = "Benvenuta";
                }
            </script>
            <div id="user-playlists" class="mt-4">
                <h3>Le tue playlist</h3>
                <div id="playlist-list" class="row row-cols-1 row-cols-md-2 g-3"></div>
            </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
    <script src="js/signup.js"></script>
    <script src="js/playlists.js"></script>
    <script src="js/search.js"></script>
    <script src="js/accessToken.js"></script>
    <script src="js/index.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const profileBtn = document.getElementById('profile-btn');
            const logged = sessionStorage.getItem('logged');
            if (logged) {
                profileBtn.classList.remove('d-none');
                profileBtn.addEventListener('click', function() {
                    window.location.href = `user.html?user=${encodeURIComponent(logged)}`;
                });
            } else {
                profileBtn.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
