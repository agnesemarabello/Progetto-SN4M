<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login | MyMusic</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-vector/20220608/ourlarge/pngtree-music-note-icon-green-vector-isolated-on-white-background-png-image_4932553.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <link rel="stylesheet" href="styles/login.css">

     <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-music"></i>
            <span>MyMusic</span>
        </div>
        <div class="login-form">
            <h2 class="text-center mb-4">Accedi al tuo account</h2>
            <form>
                <div class="mb-3">
                    <label for="UserID" class="form-label">Nome utente</label>
                    <input type="text" class="form-control" id="UserID" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="Password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="Password">
                </div>
                <button type="button" class="btn btn-primary" onclick="controlla()">Accedi</button>
                </form>
            <div class="login-footer">
                <p>Non hai un account? <a href="signup.html">Iscriviti</a></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
