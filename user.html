<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Profilo utente | MyMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="stylesheet" href="styles/user.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700,900&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-vector/20220608/ourlarge/pngtree-music-note-icon-green-vector-isolated-on-white-background-png-image_4932553.png" type="image/x-icon">
</head>
<body>
    <div class="container">
        <div class="profile-card">
            <div id="user-profile"></div>
            <div class="profile-actions">
                <button id="edit-profile" class="btn btn-edit rounded-pill px-4"><i class="fas fa-pen me-2"></i>Modifica</button>
                <button id="delete-profile" class="btn btn-delete rounded-pill px-4"><i class="fas fa-trash me-2"></i>Elimina</button>
            </div>
            <div class="text-center mt-4">
                <a href="index.html" class="btn btn-outline-light"><i class="fas fa-home me-2"></i>Torna alla Home</a>
            </div>
        </div>
    </div>

    <!-- Modal conferma eliminazione -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
          <div class="modal-header border-0">
            <h5 class="modal-title" id="deleteModalLabel">Elimina profilo</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Chiudi"></button>
          </div>
          <div class="modal-body">
            Sei sicuro di voler <span class="text-danger fw-bold">eliminare il tuo profilo</span>?<br>
            Questa azione è <b>irreversibile</b> e perderai tutte le tue playlist e quelle che hai condiviso.
          </div>
          <div class="modal-footer border-0">
            <button type="button" class="btn btn-secondary rounded-pill" data-bs-dismiss="modal">Annulla</button>
            <button type="button" class="btn btn-delete rounded-pill" id="confirm-delete">Elimina</button>
          </div>
        </div>
      </div>
    </div>

    <script src="js/user.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
