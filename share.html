<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Condividi Playlist | MyMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link rel="icon" href="https://png.pngtree.com/png-vector/20220608/ourlarge/pngtree-music-note-icon-green-vector-isolated-on-white-background-png-image_4932553.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .share-container {
            background: #181818;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(30,215,96,0.10);
            padding: 2.5rem 2rem;
            max-width: 75%;
            margin: 48px auto;
        }
        .share-title {
            color: #1ed760;
            font-weight: 700;
        }
        .form-label {
            color: #f1f3f4;
            font-weight: 500;
        }
        .form-select, .form-control, textarea {
            background: #232526;
            color: #f1f3f4;
            border: 1px solid #343a40;
        }
        .form-select:focus, .form-control:focus, textarea:focus {
            background: #232526;
            color: #f1f3f4;
            border-color: #1ed760;
            box-shadow: 0 0 0 0.2rem rgba(30,215,96,.15);
        }
        .btn-spotify {
            background: #1ed760;
            color: #181818;
            border: none;
            font-weight: 600;
            border-radius: 25px;
        }
        .btn-spotify:hover, .btn-spotify:focus {
            background: #1db954;
            color: #181818;
        }
        .btn-outline-light {
            border-radius: 25px;
        }
        hr {
            border-top: 2px solid #1ed760;
            opacity: 0.5;
        }
    </style>
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <div class="logo">
                    <i class="fas fa-music"></i>
                    <span>MyMusic</span>
                </div>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="communities.html">Comunità</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="shared-playlists.html">Esplora</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="share.html">Condividi</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="share-container">
        <h2 class="mb-4 share-title"><i class="fas fa-share-square me-2"></i>Condividi una tua playlist</h2>

        <form id="share-form" class="needs-validation" novalidate>
            <div class="mb-3">
                <label for="playlist-select" class="form-label">Scegli la playlist</label>
                <select id="playlist-select" class="form-select" required>
                    <option value="" disabled selected>Seleziona una playlist</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="community-select" class="form-label">Scegli la comunità</label>
                <select id="community-select" class="form-select" required>
                    <option value="" disabled selected>Seleziona una comunità</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="share-tags" class="form-label">Tag (separati da virgola)</label>
                <input type="text" id="share-tags" class="form-control" placeholder="es. rock, workout, chill">
            </div>

            <div class="mb-3">
                <label for="share-desc" class="form-label">Descrizione</label>
                <textarea id="share-desc" class="form-control" rows="3" placeholder="Scrivi qualcosa sulla tua playlist..."></textarea>
            </div>

            <button class="btn btn-spotify w-100" type="submit">
                <i class="fas fa-paper-plane me-2"></i>Condividi playlist
            </button>
            <div id="share-msg" class="mt-3"></div>
        </form>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
    <script src="js/sharing.js"></script>
</body>
</html>
