<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Modifica profilo | MyMusic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/index.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700,900&display=swap" rel="stylesheet">
    <link rel="icon" href="https://png.pngtree.com/png-vector/20220608/ourlarge/pngtree-music-note-icon-green-vector-isolated-on-white-background-png-image_4932553.png" type="image/x-icon">
    <style>
        body {
            background: linear-gradient(135deg, #232526 0%, #414345 100%);
            color: #f1f3f4;
        }
        .edit-card {
            background: #181818;
            border-radius: 18px;
            box-shadow: 0 4px 24px rgba(30,215,96,0.10);
            padding: 2.5rem 2rem;
            max-width: 540px;
            margin: 48px auto;
        }
        .form-label {
            color: #1ed760;
            font-weight: 500;
        }
        .btn-save {
            background: #1ed760;
            color: #181818;
            border: none;
        }
        .btn-save:hover, .btn-save:focus {
            background: #1db954;
            color: #181818;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="edit-card">
            <h2 class="mb-4 text-center" style="color:#1ed760;">Modifica profilo</h2>
            <form id="edit-form" autocomplete="off">
                <div class="mb-3">
                    <label for="editNome" class="form-label">Nome</label>
                    <input type="text" class="form-control" id="editNome" required>
                </div>
                <div class="mb-3">
                    <label for="editCognome" class="form-label">Cognome</label>
                    <input type="text" class="form-control" id="editCognome" required>
                </div>
                <div class="mb-3">
                    <label for="editGenere" class="form-label">Genere</label>
                    <select class="form-select" id="editGenere" required>
                        <option value="">Seleziona...</option>
                        <option value="M">M</option>
                        <option value="F">F</option>
                        <option value="Altro">Altro</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="editEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="editEmail" required>
                </div>
                <div class="mb-3">
                    <label for="editPreferenza" class="form-label">Artista preferito</label>
                    <input type="text" class="form-control" id="editPreferenza">
                </div>
                <div class="mb-3">
                    <label for="editGenerePreferito" class="form-label">Genere musicale preferito</label>
                    <select class="form-select" id="editGenerePreferito">
                        <option value="">Seleziona un genere musicale</option>
                        <option value="rock">Rock</option>
                        <option value="pop">Pop</option>
                        <option value="jazz">Jazz</option>
                        <option value="classical">Classica</option>
                        <option value="hip-hop">Hip-Hop</option>
                        <option value="electronic">Elettronica</option>
                        <option value="country">Country</option>
                        <option value="reggae">Reggae</option>
                    </select>
                </div>
                <div class="d-flex justify-content-between">
                    <a href="#" id="cancel-btn" class="btn btn-outline-light">Annulla</a>
                    <button type="submit" class="btn btn-save px-4">Salva</button>
                </div>
            </form>
        </div>
    </div>
    <script>
        // Recupera userID dalla query string
        const params = new URLSearchParams(window.location.search);
        const userID = params.get('user');
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const user = users.find(u => u.userID === userID);

        if (!user) {
            alert("Utente non trovato!");
            window.location.href = "index.html";
        }

        // Precompila il form
        document.getElementById('editNome').value = user.nome || '';
        document.getElementById('editCognome').value = user.cognome || '';
        document.getElementById('editGenere').value = user.genere || '';
        document.getElementById('editEmail').value = user.email || '';
        document.getElementById('editPreferenza').value = user.cantantePreferito || '';
        document.getElementById('editGenerePreferito').value = user.generePreferito || '';

        // Salva modifiche
        document.getElementById('edit-form').addEventListener('submit', function(e) {
            e.preventDefault();
            user.nome = document.getElementById('editNome').value.trim();
            user.cognome = document.getElementById('editCognome').value.trim();
            user.genere = document.getElementById('editGenere').value;
            user.email = document.getElementById('editEmail').value.trim();
            user.cantantePreferito = document.getElementById('editPreferenza').value.trim();
            user.generePreferito = document.getElementById('editGenerePreferito').value;

            // Aggiorna localStorage
            const idx = users.findIndex(u => u.userID === userID);
            users[idx] = user;
            localStorage.setItem('users', JSON.stringify(users));
            window.location.href = `user.html?user=${encodeURIComponent(userID)}`;
        });

        // Annulla
        document.getElementById('cancel-btn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = `user.html?user=${encodeURIComponent(userID)}`;
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
